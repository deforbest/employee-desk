# File: .github/workflows/build-apk.yml | Version: 1.0.0 | Date: 2026-10-31
# ساخت خودکار فایل نصبی اندروید (APK) به همراه نسخه‌بندی (Versioning) و انتشار در بخش Releases گیت‌هاب
name: Build Android APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'شماره نسخه دلخواه (مثلاً 1.0.5) - اگر خالی بگذارید خودکار ساخته می‌شود'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate App Version
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -z "$INPUT_VER" ]; then
            VERSION_NAME="1.0.${{ github.run_number }}"
          else
            VERSION_NAME="${INPUT_VER#v}"
          fi
          VERSION_CODE="${{ github.run_number }}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Building APK Version: v$VERSION_NAME (Code: $VERSION_CODE)"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets & Config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROXY_URL: ${{ vars.SUPABASE_PROXY_URL }}
          HIDE_ORIGIN: 'false'
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          ENABLE_GOOGLE: ${{ vars.ENABLE_GOOGLE }}
          ENABLE_GITHUB: ${{ vars.ENABLE_GITHUB }}
          ALLOW_GUEST: 'true'
          OTP_LENGTH: ${{ vars.OTP_LENGTH }}
        run: |
          mkdir -p vendor www
          npm pack @supabase/supabase-js@2.45.4 --silent
          tar -xzf ./*.tgz package/dist/umd/supabase.js
          mv package/dist/umd/supabase.js vendor/supabase.js
          rm -rf package ./*.tgz

          if [ -f "scripts/make-config.js" ]; then
            node scripts/make-config.js || cp config.example.js config.js
          else
            cp config.example.js config.js
          fi

          cp index.html manifest.webmanifest sw.js auth.js auth.css icons.js ui.css config.js icon-192.png icon-512.png icon-maskable-512.png www/
          cp -r vendor www/vendor

      - name: Initialize Capacitor Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.deforbest.employeedesk",
            "appName": "میز کار هوشمند",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Set App Version, Icons & Persistent Signing Key
        run: |
          # ۱. تنظیم نسخه (versionCode و versionName) در فایل build.gradle
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/g" android/app/build.gradle

          # ۲. جایگزینی آیکون اصلی برنامه در تمام پوشه‌های اندروید
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp icon-512.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp icon-512.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp icon-maskable-512.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done

          # ۳. ساخت کلید امضای ثابت (تا نسخه‌های بعدی بدون نیاز به حذف قبلی روی گوشی آپدیت شوند)
          echo "" | base64 -d > android/app/empdesk-release.keystore 2>/dev/null || keytool -genkeypair -v -keystore android/app/empdesk-release.keystore -alias empdesk -keyalg RSA -keysize 2048 -validity 10000 -storepass empdesk123456 -keypass empdesk123456 -dname "CN=Employee Smart Desk, OU=Engineering, O=Deforbest, L=Tehran, S=Tehran, C=IR"

          cat << 'EOF' >> android/app/build.gradle

          android.signingConfigs {
              releaseKey {
                  storeFile file("empdesk-release.keystore")
                  storePassword "empdesk123456"
                  keyAlias "empdesk"
                  keyPassword "empdesk123456"
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.releaseKey
          android.buildTypes.debug.signingConfig = android.signingConfigs.releaseKey
          EOF

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../emp-smart-desk-v${VERSION_NAME}.apk"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emp-smart-desk-v${{ env.VERSION_NAME }}-apk
          path: emp-smart-desk-v${{ env.VERSION_NAME }}.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "نسخه v${{ env.VERSION_NAME }} — فایل نصبی اندروید (APK)"
          body: |
            📱 **نسخه نصبی اندروید میز کار هوشمند کارمند (`v${{ env.VERSION_NAME }}`)**
            - قابل نصب به صورت محلی و آفلاین روی اندروید
            - کد نسخه (`versionCode`): `${{ env.VERSION_CODE }}`
            - امضاشده با کلید ثابت (امکان نصب و بروزرسانی مستقیم روی نسخه‌های قبلی بدون پاک شدن اطلاعات)
          files: emp-smart-desk-v${{ env.VERSION_NAME }}.apk

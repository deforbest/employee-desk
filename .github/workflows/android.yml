# File: .github/workflows/android.yml | Version: 2.1.0 | Date: 2026-11-01
# ساخت فایل نصبی اندروید (APK) رایگان روی گیت‌هاب. دستی اجرا می‌شود: Actions ← Build Android APK ← Run workflow.
# برنامه داخل APK بسته‌بندی می‌شود (نه بارگذاری از اینترنت)، پس کدی که اجازهٔ خواندن پیامک دارد همان کد امضاشده است.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'sms-*.js'
      - 'auth.js'
      - 'ui.css'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      CAP_VERSION: 6.1.2
    steps:
      - name: Checkout (pinned by commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up JDK 17 (pinned by commit)
        uses: actions/setup-java@c5195efecf7bdfc987ee827a71ef8b11521c0002 # v4.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Vendor supabase-js (pinned)
        run: |
          mkdir -p vendor
          npm pack @supabase/supabase-js@2.45.4 --silent
          tar -xzf ./*.tgz package/dist/umd/supabase.js
          mv package/dist/umd/supabase.js vendor/supabase.js
          rm -rf package ./*.tgz

      - name: Build config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROXY_URL: ${{ vars.SUPABASE_PROXY_URL }}
          HIDE_ORIGIN: ${{ vars.HIDE_ORIGIN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          ENABLE_GOOGLE: "false"
          ENABLE_GITHUB: "false"
          ALLOW_GUEST: ${{ vars.ALLOW_GUEST }}
          OTP_LENGTH: ${{ vars.OTP_LENGTH }}
        run: node scripts/make-config.js

      - name: Assemble web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest auth.js auth.css icons.js ui.css sms-parser.js sms-ui.js config.js icon-192.png icon-512.png icon-maskable-512.png www/
          cp -r vendor www/vendor

      - name: Create Capacitor Android project
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@$CAP_VERSION @capacitor/cli@$CAP_VERSION @capacitor/android@$CAP_VERSION
          cp android-app/capacitor.config.json capacitor.config.json
          npx cap add android
          PKG=android/app/src/main/java/com/deforbest/employeedesk
          mkdir -p "$PKG"
          cp android-app/*.java "$PKG"/
          M=android/app/src/main/AndroidManifest.xml
          # مجوزها
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_SMS" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$M"
          # بدون پشتیبان‌گیری خودکار سیستم‌عامل
          sed -i 's#android:allowBackup="true"#android:allowBackup="false" android:fullBackupContent="false" android:dataExtractionRules="@xml/data_extraction_rules"#' "$M"
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/data_extraction_rules.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="root" />
                  <exclude domain="file" />
                  <exclude domain="database" />
                  <exclude domain="sharedpref" />
                  <exclude domain="external" />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" />
                  <exclude domain="file" />
                  <exclude domain="database" />
                  <exclude domain="sharedpref" />
                  <exclude domain="external" />
              </device-transfer>
          </data-extraction-rules>
          XMLEOF
          # دریافت متن پیامک از دکمهٔ «اشتراک‌گذاری» گوشی (بدون نیاز به مجوز پیامک)
          sed -i '0,/<\/activity>/s#</activity>#        <intent-filter>\n            <action android:name="android.intent.action.SEND" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <data android:mimeType="text/plain" />\n        </intent-filter>\n    </activity>#' "$M"
          # گیرندهٔ پیامک در پس‌زمینه (فقط سیستم‌عامل می‌تواند به آن پخش کند)
          sed -i 's#</application>#    <receiver android:name=".SmsBroadcastReceiver" android:permission="android.permission.BROADCAST_SMS" android:exported="true">\n            <intent-filter android:priority="999">\n                <action android:name="android.provider.Telephony.SMS_RECEIVED" />\n            </intent-filter>\n        </receiver>\n    </application>#' "$M"
          # حداقل اندروید ۷ (لازم برای کتابخانهٔ ذخیره‌سازی رمزنگاری‌شده)
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 24/' android/variables.gradle
          grep -q 'minSdkVersion = 24' android/variables.gradle
          grep -q READ_SMS "$M"
          grep -q RECEIVE_SMS "$M"
          grep -q POST_NOTIFICATIONS "$M"
          grep -q SmsBroadcastReceiver "$M"
          grep -q 'android.intent.action.SEND' "$M"
          grep -q 'data_extraction_rules' "$M"

      - name: App icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf "$RES"/mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            mkdir -p "$RES/mipmap-$1"
            "$IM" icon-512.png -resize ${2}x${2} "$RES/mipmap-$1/ic_launcher.png"
            cp "$RES/mipmap-$1/ic_launcher.png" "$RES/mipmap-$1/ic_launcher_round.png"
            cp "$RES/mipmap-$1/ic_launcher.png" "$RES/mipmap-$1/ic_launcher_foreground.png"
          done

      - name: Sync web files and set version
        run: |
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"5.${{ github.run_number }}\"/" android/app/build.gradle
          cat << 'EOF' >> android/app/build.gradle

          android {
              packagingOptions {
                  resources {
                      excludes += 'META-INF/*.version'
                  }
              }
          }

          dependencies {
              implementation "androidx.security:security-crypto:1.1.0-alpha06"
              implementation "androidx.work:work-runtime:2.9.0"
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            ALIAS="$KS_ALIAS"; PASS="$KS_PASS"
            echo "Signing with your permanent key."
          else
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::SIGNING KEY NOT SET: release builds (v* tags) must be signed with the permanent key. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in Secrets."
              exit 1
            fi
            PASS=$(openssl rand -hex 16); ALIAS=emp
            keytool -genkeypair -keystore release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=EmployeeDesk"
            echo "::warning::No permanent signing key set. This APK is signed with a temporary key; to update the app later you must uninstall the old one first. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in Secrets."
          fi
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out EmployeeDesk.apk aligned.apk
          "$BT/apksigner" verify --verbose EmployeeDesk.apk
          rm -f release.jks
          sha256sum EmployeeDesk.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: "فایل نصبی اندروید"
          body: "آخرین نسخهٔ فایل نصبی. شمارهٔ ساخت: ${{ github.run_number }}"
          files: |
            EmployeeDesk.apk
            SHA256SUMS.txt
          make_latest: true
          overwrite_files: true

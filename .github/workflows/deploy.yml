# File: .github/workflows/deploy.yml | Version: 1.0.0 | Date: 2026-10-25
# با هر push روی شاخهٔ main:  ۱) توابع تلگرام روی Supabase دیپلوی می‌شوند  ۲) سایت روی GitHub Pages منتشر می‌شود.
# همهٔ کلیدها از Settings > Secrets and variables > Actions خوانده می‌شوند.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  supabase-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Telegram functions and webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          PLACEHOLDER_EMAIL_DOMAIN: ${{ vars.PLACEHOLDER_EMAIL_DOMAIN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Telegram/phone login not configured - skipping."; exit 0
          fi
          WH_SECRET=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          supabase functions deploy tg-auth --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy tg-webhook --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase secrets set --project-ref "$PROJECT_REF" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_WEBHOOK_SECRET="$WH_SECRET" \
            TELEGRAM_BOT_USERNAME="$TELEGRAM_BOT_USERNAME" \
            ALLOWED_ORIGIN="${ALLOWED_ORIGIN:-*}" \
            PLACEHOLDER_EMAIL_DOMAIN="${PLACEHOLDER_EMAIL_DOMAIN:-gmail.com}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://${PROJECT_REF}.supabase.co/functions/v1/tg-webhook" \
            --data-urlencode "secret_token=${WH_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]' > /dev/null
          echo "Webhook registered."

  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vendor supabase-js (self-hosted, pinned)
        run: |
          mkdir -p vendor
          npm pack @supabase/supabase-js@2.45.4 --silent
          tar -xzf ./*.tgz package/dist/umd/supabase.js
          mv package/dist/umd/supabase.js vendor/supabase.js
          rm -rf package ./*.tgz
      - name: Build config.js
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          ENABLE_GOOGLE: ${{ vars.ENABLE_GOOGLE }}
          ENABLE_GITHUB: ${{ vars.ENABLE_GITHUB }}
          ALLOW_GUEST: ${{ vars.ALLOW_GUEST }}
          OTP_LENGTH: ${{ vars.OTP_LENGTH }}
        run: node scripts/make-config.js
      - name: Assemble site (only public files)
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js auth.js auth.css config.js icon-192.png icon-512.png icon-maskable-512.png _site/
          cp -r vendor _site/vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
